# PostgreSQL de desenvolvimento, já com o usuário/senha/banco que o
# backend/.env.example espera. Sobe com `npm run setup` (ou `npm run db:up`).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: servicedesk_user
      POSTGRES_PASSWORD: servicedesk_pw
      POSTGRES_DB: servicedesk
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Roda só na primeira subida (volume vazio): cria o banco separado
      # usado pelos scripts sequelize:demo:*.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk_user -d servicedesk"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
